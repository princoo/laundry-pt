# Lifecycle scripts pnpm may run (pnpm 10+ blocks them by default). Prisma's
# are needed: engine download and client generation. The rest ship prebuilt
# binaries and work without theirs.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  core-js: false
  sharp: false
  unrs-resolver: false
